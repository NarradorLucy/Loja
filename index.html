<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mercado Ympori - Loja RPG</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#080b14;--panel:#111728;--panel2:#171e32;--text:#eef2ff;--muted:#929bb5;--accent:#8b7cff;--accent2:#38d9c3;--danger:#ff6685}
body{font-family:Inter,system-ui,Arial,sans-serif;background:radial-gradient(circle at 80% 0%,#25204d 0,#080b14 38%);color:var(--text);min-height:100vh;padding:24px}
header{max-width:1000px;margin:0 auto 30px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #242b40;padding-bottom:20px}
.logo{font-size:24px;font-weight:800}.logo span{color:var(--accent)}
.user-status{font-size:14px;color:var(--muted);display:flex;align-items:center;gap:10px}
.user-status strong{color:var(--accent2)}
.btn-session{background:var(--panel2);border:1px solid #28314a;color:#fff;padding:6px 12px;border-radius:8px;cursor:pointer;font-size:12px}

.container{max-width:1000px;margin:0 auto}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:20px}
.card{background:linear-gradient(145deg,rgba(23,30,50,.94),rgba(14,19,33,.94));border:1px solid #28314a;border-radius:18px;padding:22px;display:flex;flex-direction:column;justify-content:space-between;box-shadow:0 12px 40px rgba(0,0,0,.18)}
.item-tag{font-size:11px;color:var(--accent);font-weight:700;text-transform:uppercase;margin-bottom:6px}
.item-title{font-size:18px;font-weight:700;margin-bottom:8px}
.item-desc{font-size:13px;color:var(--muted);line-height:1.4;margin-bottom:16px;flex-grow:1}
.item-footer{display:flex;justify-content:space-between;align-items:center;margin-top:10px}
.price{font-size:18px;font-weight:800;color:var(--accent2)}
.btn-buy{background:var(--accent);border:0;color:#fff;padding:10px 18px;border-radius:10px;font-weight:700;cursor:pointer;transition:0.2s}
.btn-buy:hover{opacity:0.9;transform:translateY(-1px)}

.toast{position:fixed;right:25px;bottom:25px;background:#171e32;border:1px solid #303b59;padding:13px 18px;border-radius:12px;display:none;z-index:20;font-weight:600}
</style>
</head>
<body>

<header>
  <div>
    <div class="logo">Loja<span>Ympori</span></div>
    <p style="font-size: 12px; color: var(--muted);">Itens & Equipamentos de RPG</p>
  </div>
  <div class="user-status" id="userStatus">
    <span>Conectado como: <strong id="sessionUser">Detectando...</strong></span>
    <button class="btn-session" onclick="changeUser()">Trocar Conta</button>
  </div>
</header>

<main class="container">
  <div class="grid" id="catalog"></div>
</main>

<div id="toast" class="toast"></div>

<script>
// URL da API configurada no Google Apps Script
const API_URL = "https://script.google.com/macros/s/AKfycbyin4Und1JN-lPq9vBjDpz4EzeXb7g_GkBe44SmRyzvQGNBKwTYEZo0CFquPYCPioM/exec";

// Catálogo de Itens do RPG
const items = [
  { category: "Consumível", name: "Poção de Vida Maior", desc: "Restaura 50 PVs instantaneamente durante o combate.", price: 150.00 },
  { category: "Equipamento", name: "Espada de Mithril", desc: "Arma leve e afiada. Concede +2 de bônus nos testes de ataque.", price: 1200.00 },
  { category: "Pergaminho", name: "Pergaminho de Teleporte", desc: "Permite escapar imediatamente de uma batalha ou armadilha.", price: 450.00 },
  { category: "Acessório", name: "Anel de Proteção Arcano", desc: "Aumenta a Defesa / Classe de Armadura em +1.", price: 800.00 },
  { category: "Ferramenta", name: "Kit de Arrombamento Mágico", desc: "Garante vantagem para abrir fechaduras trancadas.", price: 300.00 },
  { category: "Relíquia", name: "Pedra de Mana Bruta", desc: "Recarrega slots de magia de nível 1 ao nível 3.", price: 950.00 }
];

let currentUser = localStorage.getItem('ympori_session') || null;

function initStore() {
  updateUserUI();
  renderCatalog();
}

function updateUserUI() {
  const display = document.getElementById('sessionUser');
  if (currentUser) {
    display.textContent = currentUser;
  } else {
    display.textContent = "Nenhuma (Convidado)";
  }
}

function changeUser() {
  const newUser = prompt("Informe seu nome de usuário ou Código de Conta (YMP-XXXX) no Ympori Bank:");
  if (newUser && newUser.trim() !== "") {
    currentUser = newUser.trim();
    localStorage.setItem('ympori_session', currentUser);
    updateUserUI();
    toast(`Sessão alterada para: ${currentUser}`);
  }
}

function renderCatalog() {
  const catalog = document.getElementById('catalog');
  catalog.innerHTML = items.map((item, index) => `
    <div class="card">
      <div>
        <div class="item-tag">${item.category}</div>
        <div class="item-title">${item.name}</div>
        <div class="item-desc">${item.desc}</div>
      </div>
      <div class="item-footer">
        <div class="price">Yinporion ${item.price.toLocaleString('pt-BR', {minimumFractionDigits: 2})}</div>
        <button class="btn-buy" onclick="buyItem(${index})">Comprar</button>
      </div>
    </div>
  `).join('');
}

async function buyItem(index) {
  const item = items[index];

  if (!currentUser) {
    changeUser();
    if (!currentUser) return;
  }

  toast(`Processando compra de "${item.name}"...`);

  try {
    const payload = {
      action: "buy",
      userKey: currentUser,
      itemName: item.name,
      amount: item.price
    };

    const response = await fetch(API_URL, {
      method: 'POST',
      body: JSON.stringify(payload)
    });

    const res = await response.json();

    if (res.success) {
      toast(`✅ ${res.message}`);

      // Atualiza o localStorage se o banco estiver aberto na mesma aba/navegador
      let localAccounts = JSON.parse(localStorage.getItem('ympori_accounts')) || {};
      if (localAccounts[currentUser]) {
        localAccounts[currentUser].balance = res.newBalance;
        localAccounts[currentUser].transactions = localAccounts[currentUser].transactions || [];
        localAccounts[currentUser].transactions.push({
          type: 'out',
          title: `Loja RPG: ${item.name}`,
          date: new Date().toLocaleDateString('pt-BR', { day: '2-digit', month: 'short' }),
          amount: item.price
        });
        localStorage.setItem('ympori_accounts', JSON.stringify(localAccounts));
      }
    } else {
      toast(`❌ ${res.message || 'Erro ao processar compra.'}`);
    }
  } catch (e) {
    console.error(e);
    toast("❌ Erro de conexão com o Ympori Bank.");
  }
}

function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.style.display = 'block';
  setTimeout(() => t.style.display = 'none', 3000);
}

initStore();
</script>
</body>
</html>
