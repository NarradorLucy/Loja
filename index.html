<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nossa Loja Virtual</title>
  <style>
    * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { margin: 0; padding: 0; background-color: #f4f6f8; color: #333; }
    
    header { background-color: #2c3e50; color: white; padding: 15px 30px; display: flex; justify-content: space-between; align-items: center; }
    header h1 { margin: 0; font-size: 1.5rem; }
    .btn-mercador { background: #e67e22; border: none; color: white; padding: 10px 18px; font-weight: bold; border-radius: 5px; cursor: pointer; transition: 0.2s; }
    .btn-mercador:hover { background: #d35400; }

    .container { display: flex; gap: 20px; padding: 20px; max-width: 1200px; margin: 0 auto; flex-wrap: wrap; }
    
    /* Vitrine */
    .vitrine { flex: 2; min-width: 300px; }
    .grid-produtos { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 15px; margin-top: 15px; }
    .card-produto { background: white; border-radius: 8px; padding: 15px; text-align: center; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
    .card-produto .icone { font-size: 2.5rem; margin-bottom: 10px; }
    .card-produto h3 { margin: 5px 0; font-size: 1.1rem; }
    .card-produto .preco { color: #27ae60; font-weight: bold; font-size: 1.2rem; margin: 10px 0; }
    .btn-add { background: #27ae60; color: white; border: none; padding: 8px 12px; border-radius: 4px; cursor: pointer; width: 100%; font-weight: bold; }
    .btn-add:hover { background: #219150; }

    /* Carrinho */
    .carrinho { flex: 1; min-width: 280px; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); height: fit-content; }
    .carrinho h2 { margin-top: 0; border-bottom: 2px solid #f4f6f8; padding-bottom: 10px; }
    .item-carrinho { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; padding-bottom: 10px; border-bottom: 1px solid #eee; }
    .qtd-controls button { background: #ddd; border: none; width: 25px; height: 25px; cursor: pointer; font-weight: bold; border-radius: 3px; }
    .total { font-size: 1.3rem; font-weight: bold; margin-top: 15px; text-align: right; color: #2c3e50; }
    .btn-comprar { background: #2980b9; color: white; border: none; padding: 12px; border-radius: 5px; cursor: pointer; width: 100%; font-weight: bold; font-size: 1rem; margin-top: 15px; }
    .btn-comprar:hover { background: #1f618d; }

    /* Modais */
    .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); justify-content: center; align-items: center; }
    .modal-content { background: white; padding: 25px; border-radius: 8px; width: 90%; max-width: 500px; max-height: 85vh; overflow-y: auto; position: relative; }
    .fechar { position: absolute; right: 15px; top: 15px; cursor: pointer; font-size: 1.2rem; font-weight: bold; }
    
    input { width: 100%; padding: 10px; margin: 8px 0 15px 0; border: 1px solid #ccc; border-radius: 4px; }
    .tabela-admin { width: 100%; border-collapse: collapse; margin-top: 15px; }
    .tabela-admin th, .tabela-admin td { border: 1px solid #ddd; padding: 8px; text-align: left; }
    .btn-danger { background: #e74c3c; color: white; border: none; padding: 5px 8px; border-radius: 3px; cursor: pointer; }
    .btn-edit { background: #f39c12; color: white; border: none; padding: 5px 8px; border-radius: 3px; cursor: pointer; }
  </style>
</head>
<body>

  <header>
    <h1>🛒 Loja Virtual</h1>
    <button class="btn-mercador" onclick="abrirModalLogin()">Mercador</button>
  </header>

  <div class="container">
    <!-- Vitrine de Produtos -->
    <div class="vitrine">
      <h2>Produtos Disponíveis</h2>
      <div id="grid-produtos" class="grid-produtos">
        <p>Carregando produtos...</p>
      </div>
    </div>

    <!-- Carrinho de Compras -->
    <div class="carrinho">
      <h2>Seu Carrinho</h2>
      <div id="itens-carrinho">
        <p>O carrinho está vazio.</p>
      </div>
      <div class="total">Total: R$ <span id="valor-total">0.00</span></div>
      <button class="btn-comprar" onclick="finalizarCompra()">Comprar e Baixar Nota</button>
    </div>
  </div>

  <!-- Modal Login Mercador -->
  <div id="modal-login" class="modal">
    <div class="modal-content">
      <span class="fechar" onclick="fecharModal('modal-login')">&times;</span>
      <h2>Área do Mercador</h2>
      <label>Usuário:</label>
      <input type="text" id="login-usuario" placeholder="Digite o usuário">
      <label>Senha:</label>
      <input type="password" id="login-senha" placeholder="Digite a senha">
      <button class="btn-add" onclick="autenticarMercador()">Entrar</button>
    </div>
  </div>

  <!-- Modal Painel do Mercador -->
  <div id="modal-admin" class="modal">
    <div class="modal-content">
      <span class="fechar" onclick="fecharModal('modal-admin')">&times;</span>
      <h2>Painel de Gestão de Produtos</h2>
      
      <h3>Adicionar / Editar Produto</h3>
      <input type="hidden" id="prod-id">
      <label>Nome do Produto:</label>
      <input type="text" id="prod-nome" placeholder="Ex: Maçã">
      <label>Ícone / Emoji:</label>
      <input type="text" id="prod-icone" placeholder="Ex: 🍎">
      <label>Preço (R$):</label>
      <input type="number" step="0.01" id="prod-preco" placeholder="Ex: 2.50">
      <button class="btn-add" onclick="salvarProduto()">Salvar Produto</button>

      <h3 style="margin-top: 20px;">Produtos Cadastrados</h3>
      <table class="tabela-admin">
        <thead>
          <tr>
            <th>Ícone</th>
            <th>Nome</th>
            <th>Preço</th>
            <th>Ações</th>
          </tr>
        </thead>
        <tbody id="corpo-tabela-admin"></tbody>
      </table>
    </div>
  </div>

  <script>
    // URL do seu Google Apps Script já configurada
    const API_URL = "https://script.google.com/macros/s/AKfycbxI67RA6Qrybom4UZ6lI9sP0JsDoOuwBEZXugZX33d6UzVrYyHoYI_nsgCZrU91Ads/exec";

    let produtos = [];
    let carrinho = {};

    window.onload = function() {
      carregarProdutos();
    };

    function carregarProdutos() {
      fetch(API_URL)
        .then(res => res.json())
        .then(data => {
          produtos = data;
          renderizarVitrine();
          renderizarTabelaAdmin();
        })
        .catch(err => console.error("Erro ao carregar produtos:", err));
    }

    function sincronizarComDrive() {
      fetch(API_URL, {
        method: "POST",
        body: JSON.stringify(produtos)
      })
      .then(res => res.json())
      .then(data => {
        carregarProdutos();
      });
    }

    function renderizarVitrine() {
      const grid = document.getElementById("grid-produtos");
      grid.innerHTML = "";
      produtos.forEach(p => {
        grid.innerHTML += `
          <div class="card-produto">
            <div class="icone">${p.icone || '📦'}</div>
            <h3>${p.nome}</h3>
            <div class="preco">R$ ${p.preco.toFixed(2)}</div>
            <button class="btn-add" onclick="adicionarAoCarrinho(${p.id})">Adicionar</button>
          </div>
        `;
      });
    }

    function adicionarAoCarrinho(id) {
      if (carrinho[id]) {
        carrinho[id]++;
      } else {
        carrinho[id] = 1;
      }
      renderizarCarrinho();
    }

    function alterarQtd(id, delta) {
      if (carrinho[id]) {
        carrinho[id] += delta;
        if (carrinho[id] <= 0) delete carrinho[id];
      }
      renderizarCarrinho();
    }

    function renderizarCarrinho() {
      const divCarrinho = document.getElementById("itens-carrinho");
      divCarrinho.innerHTML = "";
      let total = 0;

      const keys = Object.keys(carrinho);
      if (keys.length === 0) {
        divCarrinho.innerHTML = "<p>O carrinho está vazio.</p>";
        document.getElementById("valor-total").innerText = "0.00";
        return;
      }

      keys.forEach(id => {
        const prod = produtos.find(p => p.id == id);
        if (prod) {
          const subtotal = prod.preco * carrinho[id];
          total += subtotal;
          divCarrinho.innerHTML += `
            <div class="item-carrinho">
              <div>
                <strong>${prod.nome}</strong><br>
                <small>R$ ${prod.preco.toFixed(2)} x ${carrinho[id]}</small>
              </div>
              <div class="qtd-controls">
                <button onclick="alterarQtd(${prod.id}, -1)">-</button>
                <span style="margin: 0 5px;">${carrinho[id]}</span>
                <button onclick="alterarQtd(${prod.id}, 1)">+</button>
              </div>
            </div>
          `;
        }
      });

      document.getElementById("valor-total").innerText = total.toFixed(2);
    }

    function finalizarCompra() {
      const keys = Object.keys(carrinho);
      if (keys.length === 0) {
        alert("Seu carrinho está vazio!");
        return;
      }

      let dataAtual = new Date().toLocaleString("pt-BR");
      let conteudoNota = "=========================================\n";
      conteudoNota += "           COMPROVANTE DE COMPRA         \n";
      conteudoNota += "=========================================\n";
      conteudoNota += `Data: ${dataAtual}\n\n`;
      conteudoNota += "ITENS COMPRADOS:\n";
      conteudoNota += "-----------------------------------------\n";

      let total = 0;
      keys.forEach(id => {
        const prod = produtos.find(p => p.id == id);
        if (prod) {
          const qtd = carrinho[id];
          const subtotal = prod.preco * qtd;
          total += subtotal;
          conteudoNota += `${prod.nome.padEnd(20, ' ')} | Qtd: ${qtd} | Unit: R$ ${prod.preco.toFixed(2)} | Sub: R$ ${subtotal.toFixed(2)}\n`;
        }
      });

      conteudoNota += "-----------------------------------------\n";
      conteudoNota += `VALOR TOTAL: R$ ${total.toFixed(2)}\n`;
      conteudoNota += "=========================================\n";
      conteudoNota += "       Obrigado pela sua compra!         \n";

      const blob = new Blob([conteudoNota], { type: "text/plain;charset=utf-8" });
      const link = document.createElement("a");
      link.href = URL.createObjectURL(blob);
      link.download = `Nota_Compra_${Date.now()}.txt`;
      link.click();

      carrinho = {};
      renderizarCarrinho();
      alert("Compra realizada com sucesso! Sua nota foi baixada.");
    }

    function abrirModalLogin() {
      document.getElementById("modal-login").style.display = "flex";
    }

    function fecharModal(id) {
      document.getElementById(id).style.display = "none";
    }

    function autenticarMercador() {
      const user = document.getElementById("login-usuario").value;
      const pass = document.getElementById("login-senha").value;

      if (user === "loja" && pass === "vagalume") {
        fecharModal("modal-login");
        document.getElementById("modal-admin").style.display = "flex";
        document.getElementById("login-usuario").value = "";
        document.getElementById("login-senha").value = "";
      } else {
        alert("Usuário ou senha incorretos!");
      }
    }

    function renderizarTabelaAdmin() {
      const tbody = document.getElementById("corpo-tabela-admin");
      tbody.innerHTML = "";
      produtos.forEach(p => {
        tbody.innerHTML += `
          <tr>
            <td>${p.icone || '📦'}</td>
            <td>${p.nome}</td>
            <td>R$ ${p.preco.toFixed(2)}</td>
            <td>
              <button class="btn-edit" onclick="prepararEdicao(${p.id})">Editar</button>
              <button class="btn-danger" onclick="excluirProduto(${p.id})">Excluir</button>
            </td>
          </tr>
        `;
      });
    }

    function salvarProduto() {
      const id = document.getElementById("prod-id").value;
      const nome = document.getElementById("prod-nome").value;
      const icone = document.getElementById("prod-icone").value;
      const preco = parseFloat(document.getElementById("prod-preco").value);

      if (!nome || isNaN(preco)) {
        alert("Preencha o nome e o preço corretamente.");
        return;
      }

      if (id) {
        const index = produtos.findIndex(p => p.id == id);
        if (index !== -1) {
          produtos[index] = { id: parseInt(id), nome, icone, preco };
        }
      } else {
        const novoId = produtos.length > 0 ? Math.max(...produtos.map(p => p.id)) + 1 : 1;
        produtos.push({ id: novoId, nome, icone, preco });
      }

      document.getElementById("prod-id").value = "";
      document.getElementById("prod-nome").value = "";
      document.getElementById("prod-icone").value = "";
      document.getElementById("prod-preco").value = "";

      sincronizarComDrive();
    }

    function prepararEdicao(id) {
      const prod = produtos.find(p => p.id == id);
      if (prod) {
        document.getElementById("prod-id").value = prod.id;
        document.getElementById("prod-nome").value = prod.nome;
        document.getElementById("prod-icone").value = prod.icone;
        document.getElementById("prod-preco").value = prod.preco;
      }
    }

    function excluirProduto(id) {
      if (confirm("Tem certeza que deseja excluir este produto?")) {
        produtos = produtos.filter(p => p.id != id);
        sincronizarComDrive();
      }
    }
  </script>
</body>
</html>
