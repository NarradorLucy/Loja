<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mercado Ympori - Loja RPG</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#080b14;--panel:#111728;--panel2:#171e32;--text:#eef2ff;--muted:#929bb5;--accent:#8b7cff;--accent2:#38d9c3;--danger:#ff6685}
body{font-family:Inter,system-ui,sans-serif;background:radial-gradient(circle at 80% 0%,#25204d 0,#080b14 38%);color:var(--text);min-height:100vh;padding:24px}
header{max-width:1000px;margin:0 auto 30px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #242b40;padding-bottom:20px}
.logo{font-size:24px;font-weight:800}.logo span{color:var(--accent)}
.user-status{font-size:14px;color:var(--muted);display:flex;align-items:center;gap:10px}
.user-status strong{color:var(--accent2)}
.btn-session{background:var(--panel2);border:1px solid #28314a;color:#fff;padding:6px 12px;border-radius:8px;cursor:pointer;font-size:12px}

.container{max-width:1000px;margin:0 auto}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:20px}
.card{background:linear-gradient(145deg,rgba(23,30,50,.94),rgba(14,19,33,.94));border:1px solid #28314a;border-radius:18px;padding:22px;display:flex;flex-direction:column;justify-content:space-between;box-shadow:0 12px 40px rgba(0,0,0,.18)}
.item-tag{font-size:11px;color:var(--accent);font-weight:700;text-transform:uppercase;margin-bottom:6px}
.item-title{font-size:18px;font-weight:700;margin-bottom:8px}
.item-desc{font-size:13px;color:var(--muted);line-height:1.4;margin-bottom:16px;flex-grow:1}
.item-footer{display:flex;justify-content:space-between;align-items:center;margin-top:10px}
.price{font-size:18px;font-weight:800;color:var(--accent2)}
.btn-buy{background:var(--accent);border:0;color:#fff;padding:10px 18px;border-radius:10px;font-weight:700;cursor:pointer;transition:0.2s}
.btn-buy:hover{opacity:0.9;transform:translateY(-1px)}

/* Modal de Confirmação com Senha */
.modal{position:fixed;inset:0;background:rgba(0,0,0,.75);display:none;place-items:center;z-index:30}
.modal-content{background:#111728;padding:24px;border-radius:18px;border:1px solid #28314a;width:100%;max-width:380px}
.field{display:grid;gap:6px;margin:15px 0}
.field label{font-size:13px;color:var(--muted)}
input{background:#0c1120;border:1px solid #2b3550;color:#fff;border-radius:10px;padding:12px;outline:none;width:100%}
input:focus{border-color:var(--accent)}
.modal-actions{display:flex;gap:10px;margin-top:20px}
.btn-alt{background:#252d46;border:0;color:#fff;padding:10px;border-radius:10px;font-weight:700;cursor:pointer;flex:1}

.toast{position:fixed;right:25px;bottom:25px;background:#171e32;border:1px solid #303b59;padding:13px 18px;border-radius:12px;display:none;z-index:20;font-weight:600}
</style>
</head>
<body>

<header>
  <div>
    <div class="logo">Loja<span>Ympori</span></div>
    <p style="font-size: 12px; color: var(--muted);">Itens & Equipamentos de RPG</p>
  </div>
  <div class="user-status">
    <span>Conectado como: <strong id="sessionUser">Detectando...</strong></span>
    <button class="btn-session" onclick="changeUser()">Trocar Conta</button>
  </div>
</header>

<main class="container">
  <div class="grid" id="catalog"></div>
</main>

<!-- Modal de Confirmação de Compra -->
<div id="buyModal" class="modal">
  <div class="modal-content">
    <h3 style="margin-bottom:8px;">Confirmar Pagamento</h3>
    <p style="font-size:13px; color:var(--muted);" id="modalItemDesc">Item: --</p>
    
    <form onsubmit="executePurchase(event)">
      <div class="field">
        <label>Usuário / Código YMP</label>
        <input id="modalUser" required placeholder="Seu login no banco">
      </div>
      <div class="field">
        <label>Senha do Ympori Bank</label>
        <input id="modalPass" type="password" required placeholder="Sua senha de acesso">
      </div>
      
      <div class="modal-actions">
        <button type="button" class="btn-alt" onclick="closeBuyModal()">Cancelar</button>
        <button type="submit" class="btn-buy" style="flex:1;">Pagar</button>
      </div>
    </form>
  </div>
</div>

<div id="toast" class="toast"></div>

<script>
const API_URL = "https://script.google.com/macros/s/AKfycbyin4Und1JN-lPq9vBjDpz4EzeXb7g_GkBe44SmRyzvQGNBKwTYEZo0CFquPYCPioM/exec";

const items = [
  { category: "Consumível", name: "Poção de Vida Maior", desc: "Restaura 50 PVs instantaneamente.", price: 150.00 },
  { category: "Equipamento", name: "Espada de Mithril", desc: "Arma leve. +2 nos testes de ataque.", price: 1200.00 },
  { category: "Pergaminho", name: "Pergaminho de Teleporte", desc: "Escapa imediatamente de uma batalha.", price: 450.00 },
  { category: "Acessório", name: "Anel de Proteção Arcano", desc: "Aumenta a Defesa em +1.", price: 800.00 }
];

let currentUser = localStorage.getItem('ympori_session') || '';
let selectedItem = null;

function initStore() {
  updateUserUI();
  renderCatalog();
}

function updateUserUI() {
  document.getElementById('sessionUser').textContent = currentUser || "Nenhuma";
}

function changeUser() {
  const newUser = prompt("Informe seu usuário no Ympori Bank:");
  if (newUser && newUser.trim() !== "") {
    currentUser = newUser.trim();
    localStorage.setItem('ympori_session', currentUser);
    updateUserUI();
  }
}

function renderCatalog() {
  const catalog = document.getElementById('catalog');
  catalog.innerHTML = items.map((item, index) => `
    <div class="card">
      <div>
        <div class="item-tag">${item.category}</div>
        <div class="item-title">${item.name}</div>
        <div class="item-desc">${item.desc}</div>
      </div>
      <div class="item-footer">
        <div class="price">Yinporion ${item.price.toLocaleString('pt-BR', {minimumFractionDigits: 2})}</div>
        <button class="btn-buy" onclick="openBuyModal(${index})">Comprar</button>
      </div>
    </div>
  `).join('');
}

function openBuyModal(index) {
  selectedItem = items[index];
  document.getElementById('modalItemDesc').textContent = `${selectedItem.name} - Yinporion ${selectedItem.price.toFixed(2)}`;
  document.getElementById('modalUser').value = currentUser;
  document.getElementById('modalPass').value = '';
  document.getElementById('buyModal').style.display = 'grid';
}

function closeBuyModal() {
  document.getElementById('buyModal').style.display = 'none';
}

async function executePurchase(e) {
  e.preventDefault();
  
  const user = document.getElementById('modalUser').value.trim();
  const pass = document.getElementById('modalPass').value.trim();

  if (!user || !pass) {
    toast("Preencha o usuário e a senha!");
    return;
  }

  toast("Validando credenciais...");

  try {
    const payload = {
      action: "buy",
      userKey: user,
      userPass: pass,
      itemName: selectedItem.name,
      amount: selectedItem.price
    };

    const response = await fetch(API_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify(payload)
    });

    const res = await response.json();

    if (res.success) {
      toast(`✅ ${res.message}`);
      closeBuyModal();
      
      // Salva sessão local para próximas compras
      currentUser = user;
      localStorage.setItem('ympori_session', currentUser);
      updateUserUI();

      // Sincroniza saldo local no navegador se o banco estiver na mesma aba
      let localAccounts = JSON.parse(localStorage.getItem('ympori_accounts')) || {};
      let userKeyInLocal = Object.keys(localAccounts).find(k => k === user || localAccounts[k].code === user);
      if (userKeyInLocal && localAccounts[userKeyInLocal]) {
        localAccounts[userKeyInLocal].balance = res.newBalance;
        localStorage.setItem('ympori_accounts', JSON.stringify(localAccounts));
      }
    } else {
      toast(`❌ ${res.message}`);
    }
  } catch (err) {
    console.error(err);
    toast("❌ Erro de conexão com o banco.");
  }
}

function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.style.display = 'block';
  setTimeout(() => t.style.display = 'none', 3000);
}

initStore();
</script>
</body>
</html>
