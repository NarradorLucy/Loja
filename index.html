<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Loja Ympori RPG</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#080b14;--panel:#111728;--panel2:#171e32;--text:#eef2ff;--muted:#929bb5;--accent:#8b7cff;--accent2:#38d9c3;--danger:#ff6685}
body{font-family:Inter,system-ui,sans-serif;background:radial-gradient(circle at 80% 0%,#25204d 0,#080b14 38%);color:var(--text);min-height:100vh;padding:24px}
header{max-width:1000px;margin:0 auto 30px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #242b40;padding-bottom:20px;flex-wrap:wrap;gap:15px}
.logo{font-size:24px;font-weight:800}.logo span{color:var(--accent)}
.user-bar{background:var(--panel2);border:1px solid #28314a;padding:10px 16px;border-radius:12px;display:flex;align-items:center;gap:12px}
.user-bar strong{color:var(--accent2)}
.btn-action{background:var(--accent);border:0;color:#fff;padding:8px 14px;border-radius:8px;font-weight:700;cursor:pointer;font-size:13px}
.btn-sec{background:#252d46;border:0;color:#fff;padding:8px 14px;border-radius:8px;cursor:pointer;font-size:13px}

.container{max-width:1000px;margin:0 auto}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:20px}
.card{background:linear-gradient(145deg,rgba(23,30,50,.94),rgba(14,19,33,.94));border:1px solid #28314a;border-radius:18px;padding:22px;display:flex;flex-direction:column;justify-content:space-between}
.item-tag{font-size:11px;color:var(--accent);font-weight:700;text-transform:uppercase;margin-bottom:6px}
.item-title{font-size:18px;font-weight:700;margin-bottom:8px}
.item-desc{font-size:13px;color:var(--muted);line-height:1.4;margin-bottom:16px}
.price{font-size:18px;font-weight:800;color:var(--accent2);margin-bottom:12px}

/* Modais */
.modal{position:fixed;inset:0;background:rgba(0,0,0,.8);display:none;place-items:center;z-index:30}
.modal-content{background:#111728;padding:24px;border-radius:18px;border:1px solid #28314a;width:90%;max-width:400px}
.field{display:grid;gap:6px;margin:12px 0}
.field label{font-size:13px;color:var(--muted)}
input{background:#0c1120;border:1px solid #2b3550;color:#fff;border-radius:10px;padding:12px;outline:none;width:100%}
input:focus{border-color:var(--accent)}
.modal-actions{display:flex;gap:10px;margin-top:20px}

.toast{position:fixed;right:25px;bottom:25px;background:#171e32;border:1px solid #303b59;padding:14px 20px;border-radius:12px;display:none;z-index:40;font-weight:600;max-width:350px}
</style>
</head>
<body>

<header>
  <div>
    <div class="logo">Loja<span>Ympori</span></div>
    <p style="font-size:12px;color:var(--muted);">Mercado do Ympori Bank</p>
  </div>
  
  <!-- Painel Superior de Login/Sessão -->
  <div class="user-bar">
    <div>
      <span style="font-size:12px;color:var(--muted);display:block;">Conta Ativa:</span>
      <strong id="sessionUserDisplay">Não autenticado</strong>
    </div>
    <button class="btn-action" onclick="openLoginModal()">Entrar / Trocar</button>
  </div>
</header>

<main class="container">
  <div class="grid" id="catalog"></div>
</main>

<!-- Modal 1: Login/Identificação -->
<div id="loginModal" class="modal">
  <div class="modal-content">
    <h3>Entrar com Ympori Bank</h3>
    <p style="font-size:12px;color:var(--muted);margin-top:4px;">Informe seus dados cadastrados no banco.</p>
    <form onsubmit="saveSession(event)">
      <div class="field">
        <label>Usuário / Código YMP</label>
        <input id="loginUserInput" required placeholder="Ex: Nero ou YMP-1234">
      </div>
      <div class="field">
        <label>Senha do Banco</label>
        <input id="loginPassInput" type="password" required placeholder="Sua senha">
      </div>
      <div class="modal-actions">
        <button type="button" class="btn-sec" onclick="closeModal('loginModal')">Cancelar</button>
        <button type="submit" class="btn-action" style="flex:1;">Salvar Login</button>
      </div>
    </form>
  </div>
</div>

<!-- Modal 2: Confirmação da Compra -->
<div id="buyModal" class="modal">
  <div class="modal-content">
    <h3>Confirmar Compra</h3>
    <p style="font-size:13px;color:var(--accent2);margin:10px 0;" id="modalItemTitle">--</p>
    
    <form onsubmit="executePurchase(event)">
      <div class="field">
        <label>Confirme o Usuário</label>
        <input id="buyUser" required>
      </div>
      <div class="field">
        <label>Senha do Ympori Bank</label>
        <input id="buyPass" type="password" required placeholder="Digite a senha para debitar">
      </div>
      <div class="modal-actions">
        <button type="button" class="btn-sec" onclick="closeModal('buyModal')">Cancelar</button>
        <button type="submit" class="btn-action" style="flex:1;">Confirmar Pagamento</button>
      </div>
    </form>
  </div>
</div>

<div id="toast" class="toast"></div>

<script>
const API_URL = "https://script.google.com/macros/s/AKfycbyin4Und1JN-lPq9vBjDpz4EzeXb7g_GkBe44SmRyzvQGNBKwTYEZo0CFquPYCPioM/exec";

const items = [
  { category: "Consumível", name: "Poção de Vida Maior", desc: "Restaura 50 PVs instantaneamente.", price: 150.00 },
  { category: "Equipamento", name: "Espada de Mithril", desc: "Arma leve. +2 nos testes de ataque.", price: 1200.00 },
  { category: "Pergaminho", name: "Pergaminho de Teleporte", desc: "Escapa imediatamente de uma batalha.", price: 450.00 },
  { category: "Acessório", name: "Anel de Proteção Arcano", desc: "Aumenta a Defesa em +1.", price: 800.00 }
];

let currentUser = localStorage.getItem('ympori_user') || '';
let currentPass = localStorage.getItem('ympori_pass') || '';
let selectedItem = null;

function init() {
  updateUserDisplay();
  renderCatalog();
}

function updateUserDisplay() {
  const display = document.getElementById('sessionUserDisplay');
  display.textContent = currentUser || "Não autenticado";
}

function openLoginModal() {
  document.getElementById('loginUserInput').value = currentUser;
  document.getElementById('loginPassInput').value = currentPass;
  document.getElementById('loginModal').style.display = 'grid';
}

function closeModal(id) {
  document.getElementById(id).style.display = 'none';
}

function saveSession(e) {
  e.preventDefault();
  currentUser = document.getElementById('loginUserInput').value.trim();
  currentPass = document.getElementById('loginPassInput').value.trim();
  
  localStorage.setItem('ympori_user', currentUser);
  localStorage.setItem('ympori_pass', currentPass);
  
  updateUserDisplay();
  closeModal('loginModal');
  toast("✅ Dados de acesso salvos!");
}

function renderCatalog() {
  const container = document.getElementById('catalog');
  container.innerHTML = items.map((item, i) => `
    <div class="card">
      <div>
        <div class="item-tag">${item.category}</div>
        <div class="item-title">${item.name}</div>
        <div class="item-desc">${item.desc}</div>
      </div>
      <div>
        <div class="price">Yinporion ${item.price.toFixed(2)}</div>
        <button class="btn-action" style="width:100%;" onclick="startBuy(${i})">Comprar</button>
      </div>
    </div>
  `).join('');
}

function startBuy(index) {
  if (!currentUser) {
    toast("⚠️ Por favor, entre na sua conta primeiro.");
    openLoginModal();
    return;
  }
  
  selectedItem = items[index];
  document.getElementById('modalItemTitle').textContent = `${selectedItem.name} (${selectedItem.price.toFixed(2)} Yinporions)`;
  document.getElementById('buyUser').value = currentUser;
  document.getElementById('buyPass').value = currentPass;
  document.getElementById('buyModal').style.display = 'grid';
}

async function executePurchase(e) {
  e.preventDefault();
  
  const user = document.getElementById('buyUser').value.trim();
  const pass = document.getElementById('buyPass').value.trim();

  toast("Enviando pedido ao Ympori Bank...");

  try {
    const payload = {
      action: "buy",
      userKey: user,
      userPass: pass,
      itemName: selectedItem.name,
      amount: selectedItem.price
    };

    const response = await fetch(API_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify(payload)
    });

    const res = await response.json();

    if (res.success) {
      toast(`✅ ${res.message}`);
      closeModal('buyModal');
      
      // Atualiza credenciais guardadas se foram alteradas na janela de compra
      currentUser = user;
      currentPass = pass;
      localStorage.setItem('ympori_user', user);
      localStorage.setItem('ympori_pass', pass);
      updateUserDisplay();
    } else {
      toast(`❌ ${res.message}`);
    }
  } catch (err) {
    console.error(err);
    toast("❌ Erro ao conectar ao servidor. Verifique o console (F12).");
  }
}

function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.style.display = 'block';
  setTimeout(() => t.style.display = 'none', 3500);
}

init();
</script>
</body>
</html>
